# Export the release signing key for Google Play App Signing, once.
#
# Play asks for the key encrypted with its public key (PEPK tool) so the
# phones that installed the website APK can update from Play. The keystore
# password lives only in the repository secrets, so the export runs here.
# The zip is encrypted for Google: only Play can read it. Download the
# artifact, then Play Console → App integrity → App signing → "Upload
# generated ZIP". Delete this workflow once Play shows our key.
#
# android/play/encryption_public_key.pem is this app's key from that Play
# page ("Download public encryption key"); it is public.

name: Export key for Play

on:
  # Runs when the play-key-export branch is pushed (a manual button would
  # need the file on main).
  push:
    branches: [play-key-export]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export the encrypted key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Same clean-up as release.yml: copied secrets can carry a "NAME="
          # prefix, quotes, spaces or line breaks.
          tidy() { printf '%s' "$2" | tr -d '\r\n' | sed -e "s/^[[:space:]]*$1=//" -e 's/^[[:space:]]*//; s/[[:space:]]*$//' -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'$/\1/"; }
          KEYSTORE_PASSWORD="$(tidy ANDROID_KEYSTORE_PASSWORD "$KEYSTORE_PASSWORD")"
          KEY_PASSWORD="$(tidy ANDROID_KEY_PASSWORD "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}")"
          KEY_ALIAS="$(tidy ANDROID_KEY_ALIAS "$KEY_ALIAS")"
          KEYSTORE_BASE64="$(tidy ANDROID_KEYSTORE_BASE64 "$KEYSTORE_BASE64" | tr -d ' \t' | sed -e 's/^=*//' -e 's/=*$//')"
          while [ $(( ${#KEYSTORE_BASE64} % 4 )) -ne 0 ]; do KEYSTORE_BASE64="${KEYSTORE_BASE64}="; done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

          curl -sSfL -o "$RUNNER_TEMP/pepk.jar" https://www.gstatic.com/play-apps-publisher-rapid/signing-tool/prod/pepk.jar
          mkdir -p out
          java -jar "$RUNNER_TEMP/pepk.jar" \
            --keystore="$RUNNER_TEMP/release.jks" --alias="$KEY_ALIAS" \
            --keystore-pass="$KEYSTORE_PASSWORD" --key-pass="$KEY_PASSWORD" \
            --output=out/play-signing-key.zip --include-cert --rsa-aes-encryption \
            --encryption-key-path=android/play/encryption_public_key.pem
          rm -f "$RUNNER_TEMP/release.jks"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: play-signing-key
          path: out/play-signing-key.zip
          retention-days: 7
