name: hossouko_merchant
description: Hossouko merchant app - record sales offline, sync when there is signal.
publish_to: none

# versionCode+versionName. Bump the build number on every release build.
version: 0.1.0+1

environment:
  sdk: ^3.5.2

# Every dependency added here costs download size and attack surface on a
# 2014-era handset. Justify each one in ARCHITECTURE.md before adding it.
dependencies:
  flutter:
    sdk: flutter

  # State management. No codegen.
  flutter_riverpod: ^2.5.1

  # Offline sale queue. Ships with Android, so it adds no bundled engine.
  sqflite: ^2.3.3
  path: ^1.9.0

  # Access token storage in the Android Keystore, never in SharedPreferences.
  flutter_secure_storage: ^9.2.2

  # HTTP with explicit timeouts and gzip. `http` is thinner than dio and
  # enough for a handful of endpoints.
  http: ^1.2.2
  # MediaType for multipart uploads. Already a dependency of `http`.
  http_parser: ^4.0.2

  # Opens WhatsApp for suggestions to the Hossouko team (same as the customer app).
  url_launcher: ^6.3.0

  # Where the error reporter keeps unsent reports between launches
  # (lib/core/monitoring/). Already compiled in through flutter_secure_storage,
  # so declaring it adds nothing to the APK.
  path_provider: ^2.1.4

  # One GPS fix, taken only when the merchant confirms they are standing in
  # the shop, so customers get directions to it. Never in the background.
  # 13.x is the line that supports Flutter 3.24.
  geolocator: ^13.0.1

  # Draws the payment QR the customer scans (Encaisser, Mon QR fixe). Pure
  # Dart, no native code: the QR is rendered on the phone, nothing is fetched.
  qr_flutter: ^4.1.0

  # Shop photos and videos (Photos et videos screen). Uses Android's own
  # photo picker and camera apps, so it bundles no camera or codec code;
  # photos are shrunk on the phone (maxWidth, imageQuality) before upload,
  # which is most of the saving on a prepaid bundle.
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # In-memory SQLite so the offline queue is tested against the real engine,
  # not a mock that cannot reproduce a constraint violation.
  sqflite_common_ffi: ^2.3.3

flutter:
  # Icons on, matching the customer app (hossouko-App-user). Release builds
  # tree-shake the Material icon font down to the glyphs actually used (a few
  # KB), so the ~1.6MB objection this app shipped with no longer holds — see
  # ARCHITECTURE.md for the size measurement that justifies the change.
  uses-material-design: true

  # The site's display face, for the wordmark and large numerals only (~70KB
  # per style) — what makes this app read as the same brand as hossouko-Web and
  # hossouko-App-user rather than a generic Material screen. SIL Open Font
  # License, see assets/fonts/OFL.txt. Same file, copied from hossouko-App-user
  # so both apps ship the exact same bytes.
  fonts:
    - family: InstrumentSerif
      fonts:
        - asset: assets/fonts/InstrumentSerif-Regular.ttf
        - asset: assets/fonts/InstrumentSerif-Italic.ttf
          style: italic

dependency_overrides:
  # geolocator_android 4.6.2 reads flutter.compileSdkVersion from its own
  # Gradle file, which the Flutter 3.24 Gradle plugin does not provide
  # ("Could not get unknown property 'flutter'"). 4.6.1 is the last version
  # that builds here. Remove when Flutter is upgraded.
  geolocator_android: 4.6.1
